services:
  rtcam:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) })"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.rtcam.rule=Host(`${HOST_DOMAIN}`) || Host(`cam.homelab`)'
      - 'traefik.http.services.rtcam.loadbalancer.server.port=3000'
      - 'terminate.idle=true'
    networks:
      - traefik_web

networks:
  traefik_web:
    external: true
